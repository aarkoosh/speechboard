<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speechboard</title>
  <style>
    :root {
      --bg: #eef1f7;
      --text: #1c2430;
      --primary: #0a84ff;
      --primary-tint: rgba(10, 132, 255, 0.25);
      --primary-tint-strong: rgba(10, 132, 255, 0.75);
      --danger-tint: rgba(255, 59, 48, 0.65);
      --border: rgba(28, 36, 48, 0.14);
      --radius: 16px;
      --glass-bg: rgba(255, 255, 255, 0.5);
      --glass-bg-strong: rgba(255, 255, 255, 0.68);
      --glass-border: rgba(255, 255, 255, 0.6);
      --glass-blur: blur(24px) saturate(160%);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.65);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      --blob-1: #b8d4ff;
      --blob-2: #e2c6ff;
      --blob-3: #b2eede;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body.theme-dark {
      --bg: #0c0f16;
      --text: #edf0f4;
      --border: rgba(255, 255, 255, 0.14);
      --glass-bg: rgba(26, 30, 40, 0.5);
      --glass-bg-strong: rgba(36, 41, 54, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      --blob-1: #1a3a6b;
      --blob-2: #3d2266;
      --blob-3: #0f4d46;
    }

    body.theme-light {
      --bg: #eef1f7;
      --text: #1c2430;
      --border: rgba(28, 36, 48, 0.14);
      --glass-bg: rgba(255, 255, 255, 0.5);
      --glass-bg-strong: rgba(255, 255, 255, 0.68);
      --glass-border: rgba(255, 255, 255, 0.6);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.65);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      --blob-1: #b8d4ff;
      --blob-2: #e2c6ff;
      --blob-3: #b2eede;
    }

    /* Surfaces stay readable if backdrop-filter is unsupported */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      :root,
      body.theme-light {
        --glass-bg: rgba(255, 255, 255, 0.88);
        --glass-bg-strong: rgba(255, 255, 255, 0.96);
      }

      body.theme-dark {
        --glass-bg: rgba(30, 34, 44, 0.92);
        --glass-bg-strong: rgba(40, 45, 58, 0.96);
      }
    }

    body {
      margin: 0;
      padding: 1.5rem;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      transition: background-color 0.3s ease, color 0.3s ease;
      line-height: 1.5;
    }

    /* Colorful fixed backdrop that the glass surfaces blur */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(45% 40% at 12% 18%, var(--blob-1), transparent 70%),
        radial-gradient(50% 45% at 88% 12%, var(--blob-2), transparent 70%),
        radial-gradient(60% 50% at 50% 95%, var(--blob-3), transparent 70%),
        var(--bg);
    }

    nav {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      padding: 0.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow), var(--glass-highlight);
    }

    #stopBtn {
      display: block;
      width: 100%;
      margin-bottom: 2rem;
      padding: 0.75rem 1rem;
      background: var(--danger-tint);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    #stopBtn:hover {
      filter: brightness(1.08);
      transform: scale(1.01);
    }

    #moodBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow), var(--glass-highlight);
    }

    #currentMood {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      min-width: 160px;
    }

    #currentMoodEmoji {
      font-size: 1.6rem;
      line-height: 1;
    }

    #moodMatrix {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 0.4rem;
      flex: 1;
      min-width: 240px;
      max-width: 560px;
    }

    .mood-btn {
      font-size: 1.35rem;
      line-height: 1;
      padding: 0.4rem 0;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .mood-btn:hover {
      transform: scale(1.12);
      background-color: var(--glass-bg-strong);
    }

    .mood-btn.selected {
      background-color: var(--primary-tint);
      border-color: rgba(10, 132, 255, 0.45);
      box-shadow: 0 0 0 2px var(--primary-tint);
    }

    .tab-button {
      flex: 1;
      padding: 0.75rem 1rem;
      border: none;
      background: transparent;
      color: var(--text);
      font-weight: 600;
      border-radius: calc(var(--radius) - 4px);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-button.active {
      background: var(--primary-tint-strong);
      color: white;
      box-shadow: 0 2px 12px rgba(10, 132, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .tab-button:hover:not(.active) {
      background-color: var(--glass-bg-strong);
    }

    .soundboard {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
    }

    .soundboard button {
      padding: 1.5rem 1rem;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: var(--shadow), var(--glass-highlight);
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 80px;
    }

    .soundboard button:hover {
      transform: scale(1.03);
      background: var(--primary-tint-strong);
      color: white;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .soundboard button:active {
      transform: scale(0.99);
    }

    button.speaking {
      background: var(--primary-tint-strong);
      color: white;
      border-color: rgba(255, 255, 255, 0.4);
      animation: speaking-pulse 1.2s ease-in-out infinite;
    }

    @keyframes speaking-pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(10, 132, 255, 0.55);
      }

      50% {
        box-shadow: 0 0 0 10px rgba(10, 132, 255, 0);
      }
    }

    .history-container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      padding: 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow), var(--glass-highlight);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .history-header h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    #clearHistoryBtn {
      background: var(--glass-bg-strong);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.8rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    #clearHistoryBtn:hover {
      border-color: #ff3b30;
      color: #ff3b30;
    }

    #historyList {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #historyList li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
    }

    #historyList li:last-child {
      border-bottom: none;
    }

    .history-text {
      flex: 1;
      word-break: break-word;
    }

    .history-time {
      font-size: 0.8rem;
      opacity: 0.7;
      white-space: nowrap;
    }

    .replay-btn {
      background: var(--primary-tint-strong);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0.4rem 0.8rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: filter 0.2s;
    }

    .replay-btn:hover {
      filter: brightness(1.1);
    }

    .empty-note {
      font-weight: 400;
      opacity: 0.7;
      text-align: center;
      margin-top: 1rem;
    }

    .category-card {
      background: var(--glass-bg-strong);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      box-shadow: var(--glass-highlight);
    }

    .category-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .phrase-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
    }

    .phrase-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      background: var(--glass-bg-strong);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.2rem 0.3rem 0.2rem 0.7rem;
      font-size: 0.85rem;
      box-shadow: var(--glass-highlight);
    }

    .chip-remove {
      border: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0 0.35rem;
      border-radius: 50%;
    }

    .chip-remove:hover {
      color: #ff3b30;
    }

    .add-row {
      display: flex;
      gap: 0.5rem;
    }

    .add-row input {
      flex: 1;
      margin: 0;
    }

    .primary-btn {
      background: var(--primary-tint-strong);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: filter 0.2s;
      white-space: nowrap;
    }

    .primary-btn:hover {
      filter: brightness(1.1);
    }

    .danger-btn {
      background: var(--glass-bg-strong);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.3rem 0.7rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .danger-btn:hover {
      border-color: #ff3b30;
      color: #ff3b30;
    }

    .settings-container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow), var(--glass-highlight);
    }

    .setting-group {
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .setting-group:last-child {
      border-bottom: none;
    }

    select,
    input[type="range"],
    input[type="text"],
    textarea {
      font-family: inherit;
      width: 100%;
      margin: 0.5rem 0 1rem;
      box-sizing: border-box;
      padding: 0.6rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--glass-bg-strong);
      color: var(--text);
    }

    input[type="range"] {
      padding: 0;
      background: transparent;
      border: none;
      accent-color: var(--primary);
    }

    select,
    input[type="range"] {
      cursor: pointer;
    }

    label,
    p,
    legend {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }

    fieldset.setting-group {
      border: 0;
      border-bottom: 1px solid var(--border);
      padding: 0 0 1.5rem;
      margin: 0 0 1.5rem;
      min-width: 0;
    }

    legend {
      padding: 0;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .slider-label label {
      margin-bottom: 0;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    #speakCustomBtn {
      width: 100%;
      background: var(--primary-tint-strong);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 1rem;
      border-radius: var(--radius);
      font-weight: 700;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: filter 0.2s;
    }

    #speakCustomBtn:hover {
      filter: brightness(1.1);
    }
  </style>
</head>

<body>

  <h1 class="visually-hidden">Speechboard</h1>

  <header id="moodBar">
    <div id="currentMood">
      <span id="currentMoodEmoji" aria-hidden="true">😶</span>
      <span id="currentMoodLabel">No mood set</span>
    </div>
    <div id="moodMatrix" role="group" aria-label="Select your current mood"></div>
  </header>

  <nav role="tablist" aria-label="Speechboard sections"></nav>

  <button id="stopBtn" type="button">Stop Speaking</button>

  <main>
    <div id="boards"></div>

    <section id="panel-history" class="tab-content" role="tabpanel" aria-labelledby="tab-history" hidden>
      <div class="history-container">
        <div class="history-header">
          <h2>Speech History</h2>
          <button id="clearHistoryBtn" type="button">Clear History</button>
        </div>
        <ul id="historyList"></ul>
        <p id="historyEmpty" class="empty-note">Nothing spoken yet.</p>
      </div>
    </section>

    <section id="panel-settings" class="tab-content" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <div class="settings-container">
        <fieldset class="setting-group">
          <legend>Appearance</legend>
          <label>
            <input type="checkbox" id="systemThemeToggle" checked />
            Use System Theme
          </label>
          <label for="themeSelect">Manual Theme Override:</label>
          <select id="themeSelect" disabled>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </fieldset>

        <div class="setting-group">
          <label for="languageSelect">Preferred Language:</label>
          <select id="languageSelect">
            <option value="">System Default</option>
          </select>
          <label for="voiceSelect">Voice Selection:</label>
          <select id="voiceSelect"></select>
        </div>

        <div class="setting-group">
          <div class="slider-label">
            <label for="volumeSlider">Volume</label>
            <span id="volumeValue">1.0</span>
          </div>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">

          <div class="slider-label">
            <label for="pitchSlider">Pitch</label>
            <span id="pitchValue">1.0</span>
          </div>
          <input type="range" id="pitchSlider" min="0" max="2" step="0.1" value="1">

          <div class="slider-label">
            <label for="rateSlider">Rate</label>
            <span id="rateValue">1.0</span>
          </div>
          <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1">
        </div>

        <div class="setting-group">
          <label for="customText">Speak Custom Text:</label>
          <textarea id="customText" rows="2" placeholder="Type something here..."></textarea>
          <button id="speakCustomBtn">Speak Now</button>
        </div>

        <fieldset class="setting-group">
          <legend>Manage Categories</legend>
          <div id="categoryManager"></div>
          <div class="add-row">
            <input type="text" id="newCategoryName" placeholder="New category name..."
              aria-label="New category name" />
            <button id="addCategoryBtn" type="button" class="primary-btn">Add Category</button>
          </div>
        </fieldset>
      </div>
    </section>
  </main>

  <script>
    const voiceSelect = document.getElementById("voiceSelect");
    const languageSelect = document.getElementById("languageSelect");
    const volumeSlider = document.getElementById("volumeSlider");
    const pitchSlider = document.getElementById("pitchSlider");
    const rateSlider = document.getElementById("rateSlider");
    const customText = document.getElementById("customText");
    const speakCustomBtn = document.getElementById("speakCustomBtn");
    const systemThemeToggle = document.getElementById("systemThemeToggle");
    const themeSelect = document.getElementById("themeSelect");

    const volumeValue = document.getElementById("volumeValue");
    const pitchValue = document.getElementById("pitchValue");
    const rateValue = document.getElementById("rateValue");

    let voices = [];

    function populateVoices() {
      voices = speechSynthesis.getVoices();

      const langs = [...new Set(voices.map((v) => v.lang))].sort();
      languageSelect.innerHTML = '<option value="">System Default</option>';
      langs.forEach((lang) => {
        const opt = document.createElement("option");
        opt.value = lang;
        opt.textContent = lang;
        languageSelect.appendChild(opt);
      });

      voiceSelect.innerHTML = "";
      voices.forEach((v, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `${v.name} (${v.lang})${v.default ? " — DEFAULT" : ""}`;
        voiceSelect.appendChild(opt);
      });
    }

    function speak(text, sourceBtn) {
      if (!text) return;
      if (voices.length === 0) return console.warn("Voices not yet loaded");

      speechSynthesis.cancel();

      const u = new SpeechSynthesisUtterance(text);
      u.voice = voices[voiceSelect.value];
      if (languageSelect.value) u.lang = languageSelect.value;
      u.volume = parseFloat(volumeSlider.value);
      u.pitch = parseFloat(pitchSlider.value);
      u.rate = parseFloat(rateSlider.value);

      if (sourceBtn) {
        const clearIndicator = () => sourceBtn.classList.remove("speaking");
        u.onstart = () => sourceBtn.classList.add("speaking");
        u.onend = clearIndicator;
        u.onerror = clearIndicator;
      }

      speechSynthesis.speak(u);
      addToHistory(text);
    }

    // --- Speech history (session only, capped) ---

    const HISTORY_LIMIT = 50;
    const historyEntries = [];
    const historyList = document.getElementById("historyList");
    const historyEmpty = document.getElementById("historyEmpty");

    function relativeTime(ts) {
      const seconds = Math.round((Date.now() - ts) / 1000);
      if (seconds < 10) return "just now";
      if (seconds < 60) return seconds + "s ago";
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + " min ago";
      const hours = Math.floor(minutes / 60);
      return hours + " hr ago";
    }

    function buildHistoryRow(entry) {
      const li = document.createElement("li");

      const textSpan = document.createElement("span");
      textSpan.className = "history-text";
      textSpan.textContent = entry.text;

      const timeSpan = document.createElement("span");
      timeSpan.className = "history-time";
      timeSpan.textContent = relativeTime(entry.time);

      const replayBtn = document.createElement("button");
      replayBtn.type = "button";
      replayBtn.className = "replay-btn";
      replayBtn.textContent = "Replay";
      replayBtn.setAttribute("aria-label", "Replay: " + entry.text);
      replayBtn.addEventListener("click", () => speak(entry.text, replayBtn));

      li.append(textSpan, timeSpan, replayBtn);
      return li;
    }

    function addToHistory(text) {
      const entry = { text, time: Date.now() };
      historyEntries.unshift(entry);
      if (historyEntries.length > HISTORY_LIMIT) {
        historyEntries.length = HISTORY_LIMIT;
        historyList.lastElementChild?.remove();
      }
      // Prepend instead of re-rendering so an in-flight replay button
      // keeps its speaking indicator.
      historyList.prepend(buildHistoryRow(entry));
      historyEmpty.hidden = true;
    }

    function renderHistory() {
      historyList.innerHTML = "";
      historyEmpty.hidden = historyEntries.length > 0;
      historyEntries.forEach((entry) => historyList.appendChild(buildHistoryRow(entry)));
    }

    document.getElementById("clearHistoryBtn").addEventListener("click", () => {
      historyEntries.length = 0;
      renderHistory();
    });

    speakCustomBtn.addEventListener("click", () => speak(customText.value.trim(), speakCustomBtn));

    document.getElementById("stopBtn").addEventListener("click", () => speechSynthesis.cancel());

    volumeSlider.oninput = () => (volumeValue.textContent = parseFloat(volumeSlider.value).toFixed(1));
    pitchSlider.oninput = () => (pitchValue.textContent = parseFloat(pitchSlider.value).toFixed(1));
    rateSlider.oninput = () => (rateValue.textContent = parseFloat(rateSlider.value).toFixed(1));

    // --- Current mood (persisted to localStorage) ---

    const MOOD_KEY = "speechboard-mood";
    const MOODS = [
      { emoji: "😊", name: "Happy" },
      { emoji: "😢", name: "Sad" },
      { emoji: "😠", name: "Angry" },
      { emoji: "😴", name: "Tired" },
      { emoji: "🤩", name: "Excited" },
      { emoji: "😌", name: "Calm" },
      { emoji: "🤒", name: "Sick" },
      { emoji: "😨", name: "Scared" },
      { emoji: "🤪", name: "Silly" },
      { emoji: "🙂", name: "Okay" },
    ];

    const moodMatrix = document.getElementById("moodMatrix");
    const currentMoodEmoji = document.getElementById("currentMoodEmoji");
    const currentMoodLabel = document.getElementById("currentMoodLabel");

    let currentMood = localStorage.getItem(MOOD_KEY) || "";
    if (!MOODS.some((m) => m.name === currentMood)) currentMood = "";

    function renderMoodMatrix() {
      moodMatrix.innerHTML = "";
      MOODS.forEach((mood) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "mood-btn";
        btn.textContent = mood.emoji;
        btn.dataset.mood = mood.name;
        btn.title = mood.name;
        btn.setAttribute("aria-label", mood.name);
        btn.addEventListener("click", () => setMood(mood.name));
        moodMatrix.appendChild(btn);
      });
      updateMoodDisplay();
    }

    function updateMoodDisplay() {
      const mood = MOODS.find((m) => m.name === currentMood);
      currentMoodEmoji.textContent = mood ? mood.emoji : "😶";
      currentMoodLabel.textContent = mood ? "Feeling " + mood.name : "No mood set";
      moodMatrix.querySelectorAll(".mood-btn").forEach((btn) => {
        const selected = btn.dataset.mood === currentMood;
        btn.classList.toggle("selected", selected);
        btn.setAttribute("aria-pressed", String(selected));
      });
    }

    function setMood(name) {
      currentMood = currentMood === name ? "" : name;
      if (currentMood) localStorage.setItem(MOOD_KEY, currentMood);
      else localStorage.removeItem(MOOD_KEY);
      updateMoodDisplay();
    }

    // --- Categories (persisted to localStorage) ---

    const CATEGORIES_KEY = "speechboard-categories";

    const DEFAULT_CATEGORIES = [
      {
        id: "words",
        name: "Words",
        phrases: ["Hello", "Yes", "No", "Hungry", "Help", "Thanks"],
      },
      {
        id: "sentences",
        name: "Sentences",
        phrases: [
          "I need to go to the bathroom",
          "Can I have a snack?",
          "I’m feeling tired",
          "Please speak slower",
        ],
      },
    ];

    function loadCategories() {
      try {
        const stored = JSON.parse(localStorage.getItem(CATEGORIES_KEY));
        if (Array.isArray(stored) && stored.length) return stored;
      } catch (e) { /* corrupted storage: fall back to defaults */ }
      return JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
    }

    function saveCategories() {
      localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
    }

    let categories = loadCategories();

    // --- Tabs & boards (rendered dynamically) ---

    const tablist = document.querySelector("nav[role='tablist']");
    const boards = document.getElementById("boards");
    let activeTab = categories[0]?.id || "settings";

    function renderTabs() {
      tablist.innerHTML = "";
      const entries = [
        ...categories.map((c) => ({ id: c.id, name: c.name })),
        { id: "history", name: "History" },
        { id: "settings", name: "Settings" },
      ];
      entries.forEach(({ id, name }) => {
        const btn = document.createElement("button");
        btn.className = "tab-button";
        btn.id = "tab-" + id;
        btn.dataset.tab = id;
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-controls", "panel-" + id);
        btn.textContent = name;
        tablist.appendChild(btn);
      });
      updateTabSelection();
    }

    function renderBoards() {
      boards.innerHTML = "";
      categories.forEach((cat) => {
        const section = document.createElement("section");
        section.id = "panel-" + cat.id;
        section.className = "tab-content";
        section.setAttribute("role", "tabpanel");
        section.setAttribute("aria-labelledby", "tab-" + cat.id);

        const grid = document.createElement("div");
        grid.className = "soundboard";
        cat.phrases.forEach((phrase) => {
          const btn = document.createElement("button");
          btn.textContent = phrase;
          btn.addEventListener("click", () => speak(phrase, btn));
          grid.appendChild(btn);
        });
        section.appendChild(grid);

        if (!cat.phrases.length) {
          const note = document.createElement("p");
          note.className = "empty-note";
          note.textContent = "No phrases yet. Add some under Settings › Manage Categories.";
          section.appendChild(note);
        }

        boards.appendChild(section);
      });
      updateTabSelection();
    }

    function updateTabSelection() {
      const tabs = [...tablist.querySelectorAll(".tab-button")];
      if (!tabs.some((t) => t.dataset.tab === activeTab)) {
        activeTab = tabs[0]?.dataset.tab;
      }
      tabs.forEach((btn) => {
        const selected = btn.dataset.tab === activeTab;
        btn.classList.toggle("active", selected);
        btn.setAttribute("aria-selected", String(selected));
        btn.tabIndex = selected ? 0 : -1;
      });
      document
        .querySelectorAll(".tab-content")
        .forEach((sec) => (sec.hidden = sec.id !== "panel-" + activeTab));
    }

    function selectTab(target) {
      activeTab = target;
      updateTabSelection();
      if (target === "history") renderHistory(); // refresh relative timestamps
    }

    tablist.addEventListener("click", (e) => {
      const tab = e.target.closest(".tab-button");
      if (tab) selectTab(tab.dataset.tab);
    });

    // --- Manage Categories UI ---

    const categoryManager = document.getElementById("categoryManager");
    const newCategoryName = document.getElementById("newCategoryName");

    function saveAndRender() {
      saveCategories();
      renderTabs();
      renderBoards();
      renderCategoryManager();
    }

    function renderCategoryManager() {
      categoryManager.innerHTML = "";

      categories.forEach((cat) => {
        const card = document.createElement("div");
        card.className = "category-card";

        const header = document.createElement("div");
        header.className = "category-card-header";
        const title = document.createElement("strong");
        title.textContent = cat.name;
        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "danger-btn";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", () => {
          if (!confirm(`Delete category "${cat.name}" and all its phrases?`)) return;
          categories = categories.filter((c) => c.id !== cat.id);
          saveAndRender();
        });
        header.append(title, deleteBtn);

        const chips = document.createElement("div");
        chips.className = "phrase-chips";
        cat.phrases.forEach((phrase, index) => {
          const chip = document.createElement("span");
          chip.className = "phrase-chip";
          chip.textContent = phrase;
          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "chip-remove";
          removeBtn.textContent = "×";
          removeBtn.setAttribute("aria-label", `Remove phrase: ${phrase}`);
          removeBtn.addEventListener("click", () => {
            cat.phrases.splice(index, 1);
            saveAndRender();
          });
          chip.appendChild(removeBtn);
          chips.appendChild(chip);
        });

        const addRow = document.createElement("div");
        addRow.className = "add-row";
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = "Add a phrase...";
        input.setAttribute("aria-label", `Add a phrase to ${cat.name}`);
        const addBtn = document.createElement("button");
        addBtn.type = "button";
        addBtn.className = "primary-btn";
        addBtn.textContent = "Add";
        const addPhrase = () => {
          const value = input.value.trim();
          if (!value) return;
          cat.phrases.push(value);
          saveAndRender();
        };
        addBtn.addEventListener("click", addPhrase);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") addPhrase();
        });
        addRow.append(input, addBtn);

        card.append(header, chips, addRow);
        categoryManager.appendChild(card);
      });
    }

    document.getElementById("addCategoryBtn").addEventListener("click", () => {
      const name = newCategoryName.value.trim();
      if (!name) return;
      categories.push({
        id: "cat-" + Date.now().toString(36),
        name,
        phrases: [],
      });
      newCategoryName.value = "";
      saveAndRender();
    });

    newCategoryName.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("addCategoryBtn").click();
    });

    tablist.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      const tabs = [...tablist.querySelectorAll(".tab-button")];
      const current = tabs.indexOf(document.activeElement);
      if (current === -1) return;
      const offset = e.key === "ArrowRight" ? 1 : tabs.length - 1;
      const next = tabs[(current + offset) % tabs.length];
      next.focus();
      selectTab(next.dataset.tab);
      e.preventDefault();
    });

    function applyTheme() {
      document.body.classList.remove("theme-dark", "theme-light");
      themeSelect.disabled = systemThemeToggle.checked;

      if (systemThemeToggle.checked) {
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)")
          .matches;
        document.body.classList.add(prefersDark ? "theme-dark" : "theme-light");
      } else {
        document.body.classList.add(`theme-${themeSelect.value}`);
      }
    }

    systemThemeToggle.addEventListener("change", applyTheme);
    themeSelect.addEventListener("change", applyTheme);

    // Listen for system theme changes in real-time
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (systemThemeToggle.checked) applyTheme();
    });

    renderMoodMatrix();
    renderTabs();
    renderBoards();
    renderCategoryManager();

    if (speechSynthesis.getVoices().length) populateVoices();
    speechSynthesis.onvoiceschanged = populateVoices;
    applyTheme();
  </script>
</body>

</html>
